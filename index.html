<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>韻道場</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: night at the industrial waterfront. Asphalt-black page, sodium-lamp orange for what is live,
   flare-stack red for the target words, hazard tape as the only ornament. Hard corners, slanted blocks. */
:root{
  color-scheme:dark;
  --paper:#0b0b0d; --sheet:#141416; --rule:#34343a; --ink:#f1efe9; --ink-soft:#9a978f;
  --marker:#ff9a1f; --marker-ink:#0b0b0d; --pencil:#ff3b2f; --wave:#ff9a1f; --hit:#e9e2c8;
  --display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Yu Gothic",sans-serif;
  --latin:"Bebas Neue","Arial Narrow",Impact,sans-serif;
  --hand:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
  --body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);
  background-image:radial-gradient(120% 60% at 50% 100%,rgba(255,90,20,.16),transparent 70%),
    radial-gradient(60% 30% at 85% 0%,rgba(255,154,31,.08),transparent 70%);
  background-attachment:fixed;min-height:100vh;
  color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;
  padding-inline:16px;padding-block:20px 40px}
.app{max-width:460px;margin-inline:auto;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:10px;position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;
  background:repeating-linear-gradient(-45deg,var(--marker) 0 10px,var(--paper) 10px 20px)}
.brand{display:flex;flex-direction:column;line-height:1}
.brand small{font-family:var(--latin);font-size:13px;letter-spacing:.32em;color:var(--ink-soft)}
h1{font-family:var(--display);font-weight:400;font-size:40px;margin:0;letter-spacing:.02em;line-height:1.05;
  text-shadow:3px 3px 0 var(--pencil)}
.rhyme{font-size:11px;color:var(--ink-soft);letter-spacing:.14em;text-align:right;line-height:1.2}
.rhyme b{display:block;font-family:var(--latin);font-weight:400;font-size:30px;letter-spacing:.06em;color:var(--marker);text-transform:uppercase}

.sheet{background:var(--sheet);border:1px solid var(--rule);border-top:3px solid var(--ink);overflow:hidden}
.wavebox{position:relative;border-bottom:1px solid var(--rule);background:#0e0e10}
canvas{display:block;width:100%;height:110px}
.beatinfo{position:absolute;left:10px;top:5px;font-family:var(--latin);font-size:14px;color:var(--ink-soft);letter-spacing:.16em}
.count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--latin);font-size:96px;color:var(--pencil);pointer-events:none;text-shadow:0 0 24px rgba(255,59,47,.6)}

.lines{display:flex;flex-direction:column}
.line{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(72px,auto);gap:8px;align-items:center;
  padding:11px 10px;border-bottom:1px solid var(--rule)}
.line:last-child{border-bottom:0}
.slot{min-height:54px;border:1px solid var(--rule);background:#0e0e10;transform:skewX(-8deg);display:flex;align-items:center;
  justify-content:center;text-align:center;padding:4px 10px;font-family:var(--hand);font-weight:700;font-size:16px;line-height:1.25;
  overflow-wrap:anywhere;transition:background .1s,border-color .1s,box-shadow .1s}
.slot.filled{border-color:var(--ink);background:#1d1d21}
.slot.now{background:var(--marker);color:var(--marker-ink);border-color:var(--marker);box-shadow:0 0 18px rgba(255,154,31,.55)}
.word{font-family:var(--display);font-size:20px;color:var(--pencil);text-align:center;padding:2px 4px;
  border-bottom:3px solid transparent;white-space:nowrap;text-shadow:0 0 14px rgba(255,59,47,.45)}
.word.now{border-bottom-color:var(--pencil)}
.word.free{font-family:var(--hand);font-weight:700;font-size:17px;color:var(--ink-soft);border:1px dashed var(--pencil);
  background:#0e0e10;transform:skewX(-8deg);text-shadow:none;
  min-height:54px;display:flex;align-items:center;justify-content:center;white-space:normal;overflow-wrap:anywhere;line-height:1.25}
.word.free.now{background:var(--marker);color:var(--marker-ink);border-style:solid;border-color:var(--marker);box-shadow:0 0 18px rgba(255,154,31,.55)}
.word.free.filled{color:var(--pencil);border-style:solid}
.word.hit{color:var(--hit);text-shadow:0 0 14px rgba(233,226,200,.5)}
.word.hit::after{content:"◎";font-size:12px;margin-left:3px;color:var(--marker)}
.line.example .slot{color:var(--ink-soft)}
.tag{font-size:10px;color:var(--ink-soft);letter-spacing:.14em;padding:6px 10px 0}

.controls{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button,select,input{font:inherit;color:inherit}
.go{flex:1 1 180px;font-family:var(--display);font-size:19px;padding:14px 16px;border:2px solid var(--marker);
  border-radius:0;background:var(--marker);color:var(--marker-ink);cursor:pointer;box-shadow:4px 4px 0 var(--pencil)}
.go:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--pencil)}
.go.on{background:transparent;color:var(--marker)}
.ghost{padding:13px 14px;border:1px solid var(--ink-soft);border-radius:0;background:transparent;cursor:pointer;font-weight:700}
.ghost:disabled,.go:disabled{opacity:.4;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
label{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:8px}
select{padding:6px 8px;border:1px solid var(--rule);border-radius:0;background:var(--sheet)}
.status{font-size:13px;color:var(--ink-soft);min-height:1.6em;border-left:3px solid var(--marker);padding-left:10px}
.status b{color:var(--ink)}
.typed{display:flex;flex-direction:column;gap:6px}
.typed input{width:100%;padding:12px;border:1px solid var(--ink-soft);border-radius:0;background:var(--sheet);
  font-family:var(--hand);font-weight:700;font-size:16px}
.note{font-size:12px;color:var(--ink-soft);margin:0}
.log{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.log h2{font-family:var(--display);font-weight:400;font-size:20px;margin:0;letter-spacing:.04em}
.log h2 span{font-family:var(--latin);font-size:13px;letter-spacing:.32em;color:var(--ink-soft);margin-left:8px}
.log .empty{font-size:13px;color:var(--ink-soft);margin:0}
.entry{background:var(--sheet);border:1px solid var(--rule);border-left:3px solid var(--marker)}
.entry summary{cursor:pointer;padding:10px 12px;display:flex;gap:10px;flex-wrap:wrap;align-items:baseline;font-size:13px;
  font-variant-numeric:tabular-nums}
.entry summary .when{font-weight:700}
.entry summary .meta{color:var(--ink-soft)}
.entry summary .score{margin-left:auto;color:var(--marker);font-weight:700}
.entry ol{margin:0;padding:0 12px 6px 34px;font-family:var(--hand);font-weight:700;font-size:15px}
.entry li{padding:3px 0;overflow-wrap:anywhere}
.entry li .w{font-family:var(--body);font-weight:400;font-size:12px;color:var(--pencil);margin-left:6px;white-space:nowrap}
.entry li .w.ok{color:var(--hit)}
.entry .del{margin:0 12px 10px;padding:4px 12px;font-size:12px;border:1px solid var(--rule);border-radius:0;
  background:transparent;cursor:pointer;color:var(--ink-soft)}
@media (prefers-reduced-motion:reduce){.slot,.go{transition:none}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><small>RHYME DOJO</small><h1>韻道場</h1></div>
    <span class="rhyme">今日の韻 <b id="rhymeTag">a-i</b></span>
  </header>

  <div class="sheet">
    <div class="wavebox">
      <canvas id="wave" aria-label="ビートの波形とメロディの音程"></canvas>
      <span class="beatinfo" id="beatinfo">テンポは毎回ランダム ・ Aマイナー</span>
      <div class="count" id="count" hidden></div>
    </div>
    <div class="tag" id="exTag">1行目は記入例</div>
    <div class="lines" id="lines"></div>
  </div>

  <div class="controls">
    <div class="row">
      <button class="go" id="go" type="button">ビートを流す</button>
      <button class="ghost" id="shuffle" type="button">お題を変える</button>
    </div>
    <div class="status" id="status">ボタンを押すと4カウントのあと1行目が始まります。右端の言葉で終わるように声に出してください。最後の行は、同じ韻の言葉を自分で考えて締めます。</div>
    <div class="typed" id="typed" hidden>
      <label for="typedIn">マイクの代わりに、ビートに合わせてここに打ち込めます</label>
      <input id="typedIn" type="text" autocomplete="off" placeholder="例：俺らが見せる本物の未来">
    </div>
    <div class="row">
      <label for="bars">1行の長さ
        <select id="bars"><option value="1">1小節</option><option value="2" selected>2小節</option></select>
      </label>
    </div>
    <p class="note">テンポは始めるたびに BPM 70〜110 の間でランダムに決まります。ビートをマイクが拾うと文字起こしが乱れます。イヤホンで聞くのがおすすめです。<span id="webNote">音声入力は Chrome か Safari で動きます。</span></p>
  </div>

  <section class="log" aria-labelledby="logH">
    <h2 id="logH">記録<span>LOG</span></h2>
    <p class="empty" id="logEmpty">まだ記録はありません。1回やり終えるとここに残ります。</p>
    <div id="logList" class="log"></div>
  </section>
</div>

<script>
(function(){
const RHYMES=[
  {tag:'a-i',words:['未来','世界','時代','期待','視界','正解','限界','出会い','誓い','舞台','願い','戦い']},
  {tag:'o-u',words:['最高','太陽','感情','友情','頂上','東京','成功','希望','衝動','鼓動','表情','行動']},
  {tag:'a-n',words:['時間','瞬間','簡単','空間','不安','普段','階段','看板','判断','油断','自慢','我慢']},
  {tag:'a-chi',words:['街','価値','勝ち','形','友達','旅立ち','仲間たち','生い立ち','俺たち','育ち']},
  {tag:'e-i',words:['人生','完成','快晴','反省','運命','証明','透明','冷静','個性','姿勢']},
  {tag:'a-e',words:['名前','お前','当たり前','目の前','建前','一人前','腕前','駅前','この前','持ち前']},
  {tag:'a-a',words:['仲間','頭','宝','力','体','刀','若さ','高さ','花','朝']},
  {tag:'i-n',words:['自信','写真','全身','確信','前進','決心','本心','革新','安心','関心']},
  {tag:'e-n',words:['永遠','挑戦','経験','最前線','応援','冒険','無限','人間','条件','作戦']},
  {tag:'u-u',words:['自由','理由','余裕','空中','夢中','途中','宇宙','一流','普通','苦痛']},
  {tag:'o-i',words:['思い','匂い','勢い','重い','遠い','恋','尊い','面白い','多い','黒い']}
];
const ROWS=5, LAG=0.6;
const $=id=>document.getElementById(id);
const linesEl=$('lines'), statusEl=$('status'), goBtn=$('go'), countEl=$('count');
let words=[], lens=new Array(ROWS*3+1).fill(0), text='', isExample=true;
let bpm=85, bars=2, running=false, typedMode=false;
let lastCell=-2, lastRow=-2;
let ctx=null, analyser=null, master=null, noiseBuf=null, timer=null, bassBus=null, revSend=null;
let tStart=0, t0=0, stepDur=0, nextStep=0, nextTime=0, totalSteps=0;
let pat=null;

/* ---------- お題 ---------- */
function pickWords(){
  const set=RHYMES[Math.floor(Math.random()*RHYMES.length)];
  const pool=set.words.slice();
  words=[];
  for(let i=0;i<ROWS;i++) words.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);
  words[ROWS-1]='';
  $('rhymeTag').textContent=set.tag;
}
function build(){
  linesEl.innerHTML='';
  for(let r=0;r<ROWS;r++){
    const line=document.createElement('div'); line.className='line';
    for(let s=0;s<3;s++){const d=document.createElement('div');d.className='slot';d.id='c'+(r*3+s);line.appendChild(d);}
    const w=document.createElement('div');w.className=r===ROWS-1?'word free':'word';w.id='w'+r;w.textContent=r===ROWS-1?'？':words[r];line.appendChild(w);
    linesEl.appendChild(line);
  }
}
function showExample(){
  isExample=true; $('exTag').hidden=false;
  const ex=['俺らが','見せる','本物の'];
  linesEl.children[0].classList.add('example');
  ex.forEach((t,i)=>{const c=$('c'+i);c.textContent=t;c.classList.add('filled');});
}
function clearSheet(){
  isExample=false; $('exTag').hidden=true;
  lens.fill(0); text='';
  linesEl.children[0].classList.remove('example');
  for(let i=0;i<ROWS*3;i++){const c=$('c'+i);c.textContent='';c.className='slot';}
  for(let r=0;r<ROWS-1;r++) $('w'+r).className='word';
  const fw=$('w'+(ROWS-1)); fw.className='word free'; fw.textContent='？';
}

/* ---------- ビートの自動生成 ---------- */
function genPattern(){
  const kicks=[[0,6,10],[0,3,8,11],[0,7,8,14],[0,10]];
  // [ルートのずれ, マイナーか] Aマイナーの泣ける進行
  const progs=[[[0,1],[-4,0],[3,0],[-2,0]],[[0,1],[-4,0],[-2,0],[-5,1]],[[-4,0],[-2,0],[0,1],[0,1]],[[0,1],[5,1],[-4,0],[-2,0]]];
  const scale=[0,3,5,7,10,12,15];
  const mel=[]; let i=Math.floor(Math.random()*4)+1;
  for(let s=0;s<32;s++){
    const strong=s%4===0, p=strong?0.6:(s%2===0?0.22:0.05);
    if(Math.random()<p){
      i=Math.max(0,Math.min(scale.length-1,i+Math.floor(Math.random()*5)-2));
      mel.push(57+scale[i]);
    }else mel.push(null);
  }
  if(mel[0]===null) mel[0]=57+scale[2];
  return {kick:kicks[Math.floor(Math.random()*kicks.length)],prog:progs[Math.floor(Math.random()*progs.length)],mel};
}
const hz=m=>440*Math.pow(2,(m-69)/12);
function env(g,t,peak,dur,att){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+(att||0.005));g.gain.exponentialRampToValueAtTime(0.0001,t+dur);}
function osc(type,f,t,dur,detune,dest){
  const o=ctx.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);if(detune)o.detune.value=detune;
  o.connect(dest);o.start(t);o.stop(t+dur+0.1);return o;
}
function kick(t){
  const g=ctx.createGain();env(g,t,1,0.34);g.connect(master);
  const o=osc('sine',110,t,0.34,0,g);o.frequency.exponentialRampToValueAtTime(38,t+0.12);
}
function bass808(m,t,dur){
  const g=ctx.createGain();env(g,t,0.85,dur,0.01);g.connect(bassBus);
  const f=hz(m),o=osc('sine',f*1.6,t,dur,0,g);o.frequency.exponentialRampToValueAtTime(f,t+0.05);
  const g2=ctx.createGain();env(g2,t,0.1,dur*0.7,0.01);g2.connect(master);osc('triangle',f*2,t,dur,0,g2);
}
function keys(m,t,dur,peak){
  const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(1400,t);f.frequency.exponentialRampToValueAtTime(500,t+dur);
  const g=ctx.createGain();env(g,t,peak,dur,0.02);f.connect(g);g.connect(master);g.connect(revSend);
  osc('triangle',hz(m),t,dur,-7,f);osc('sine',hz(m),t,dur,7,f);
}
function pad(notes,t,dur){
  const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=650;
  const g=ctx.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.05,t+dur*0.3);
  g.gain.setValueAtTime(0.05,t+dur*0.8);g.gain.linearRampToValueAtTime(0.0001,t+dur+0.3);
  f.connect(g);g.connect(master);g.connect(revSend);
  notes.forEach(m=>{osc('sawtooth',hz(m),t,dur+0.3,-9,f);osc('sawtooth',hz(m),t,dur+0.3,9,f);});
}
function noise(t,peak,dur,type,freq,wet){
  const s=ctx.createBufferSource(),f=ctx.createBiquadFilter(),g=ctx.createGain();
  s.buffer=noiseBuf;f.type=type;f.frequency.value=freq;env(g,t,peak,dur);
  s.connect(f).connect(g).connect(master);if(wet)g.connect(revSend);s.start(t);s.stop(t+dur+0.05);
}
function scheduleStep(n,t){
  if(n<16){ if(n%4===0) keys(n===0?69:64,t,0.25,0.3); return; }
  const m=n-16, s=m%16, bar=Math.floor(m/16), ch=pat.prog[bar%4], root=ch[0];
  if(s===0) pad([45+root,57+root,57+root+(ch[1]?3:4),57+root+7],t,stepDur*16);
  if(pat.kick.includes(s)){ kick(t); bass808(33+root,t,stepDur*5); }
  if(s===4||s===12) noise(t,0.3,0.2,'bandpass',1100,true);
  if(s%2===0) noise(t,0.045,0.035,'highpass',6000);
  if(bar%2===1&&s>=13) noise(t,0.035,0.03,'highpass',6500);
  const note=pat.mel[m%32];
  if(note!==null) keys(note,t,stepDur*7,0.2);
}
function tick(){
  if(ctx.state!=='running'){ try{ ctx.resume(); }catch(_){} }
  while(nextTime<ctx.currentTime+0.12){
    if(nextStep>=totalSteps){ finish(); return; }
    scheduleStep(nextStep,nextTime); nextStep++; nextTime+=stepDur;
  }
}

/* ---------- 声 → 空欄 ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
/* iPhoneアプリ版では本体の音声認識を使う */
const CAP=window.Capacitor, NATIVE=!!(CAP&&CAP.isNativePlatform&&CAP.isNativePlatform());
const NSR=NATIVE&&CAP.Plugins?CAP.Plugins.SpeechRecognition:null;
let nativeListening=false, nativeHooked=false;
async function startRecNative(){
  if(!NSR){ useTyped('音声認識を読み込めませんでした。'); return; }
  try{
    let perm=await NSR.checkPermissions();
    if(perm.speechRecognition!=='granted') perm=await NSR.requestPermissions();
    if(perm.speechRecognition!=='granted'){ useTyped('マイクと音声認識が許可されていません。設定アプリの「韻道場」から許可してください。'); return; }
    if(!nativeHooked){
      nativeHooked=true;
      NSR.addListener('partialResults',d=>{ if(nativeListening&&d&&d.matches&&d.matches.length) feed(String(d.matches[0]),LAG); });
    }
    nativeListening=true;
    rec={ stop(){ nativeListening=false; try{ NSR.stop(); }catch(_){} }, abort(){ this.stop(); } };
    NSR.start({language:'ja-JP',partialResults:true,popup:false}).catch(()=>{});
    await new Promise(r=>setTimeout(r,450));
  }catch(_){ useTyped('音声認識を開始できませんでした。'); }
}
let rec=null, recBase='', recFin='', skip=0, inCount=true;
function cellAt(t){
  const rowDur=bars*16*stepDur;
  if(t<0) return 0;
  const r=Math.floor(t/rowDur); if(r>=ROWS) return ROWS*3;
  const p=(t-r*rowDur)/rowDur;
  if(r===ROWS-1&&p>=0.75) return ROWS*3;
  return r*3+Math.min(2,Math.floor(p/0.75*3));
}
function feed(full,lag){
  full=full.replace(/[\s、。，．,.!?！？「」]/g,'');
  if(inCount){ skip=full.length; return; }
  const T=full.slice(Math.min(skip,full.length));
  let total=lens.reduce((a,b)=>a+b,0), last=-1;
  for(let i=0;i<lens.length;i++) if(lens[i]>0) last=i;
  if(T.length>total){
    const idx=Math.max(last,cellAt(ctx.currentTime-t0-lag));
    lens[idx]+=T.length-total;
  }else{
    let cut=total-T.length;
    for(let i=lens.length-1;i>=0&&cut>0;i--){const d=Math.min(lens[i],cut);lens[i]-=d;cut-=d;}
  }
  text=T; render();
}
function render(){
  let pos=0;
  for(let i=0;i<ROWS*3;i++){
    const c=$('c'+i), s=text.substr(pos,lens[i]); pos+=lens[i];
    c.textContent=s; c.classList.toggle('filled',s.length>0);
  }
  const own=text.substr(pos,lens[ROWS*3]), fw=$('w'+(ROWS-1));
  fw.textContent=own||'？'; fw.classList.toggle('filled',own.length>0);
  pos=0;
  for(let r=0;r<ROWS-1;r++){
    const n=lens[r*3]+lens[r*3+1]+lens[r*3+2];
    const next=lens[r*3+3];
    const span=text.substr(pos,n+next); pos+=n;
    $('w'+r).classList.toggle('hit',n>0&&span.includes(words[r]));
  }
}
function startRec(){
  if(!SR){ useTyped('このブラウザは音声入力に対応していません。'); return; }
  rec=new SR(); rec.lang='ja-JP'; rec.continuous=true; rec.interimResults=true;
  recBase=''; recFin='';
  rec.onaudiostart=()=>{ if(micReady){ const f=micReady; micReady=null; f(); } };
  rec.onresult=e=>{
    let fin='',inter='';
    for(let i=0;i<e.results.length;i++){ if(e.results[i].isFinal) fin+=e.results[i][0].transcript; else inter+=e.results[i][0].transcript; }
    recFin=fin; feed(recBase+fin+inter,LAG);
  };
  rec.onerror=e=>{
    if(e.error==='not-allowed'||e.error==='service-not-allowed'||e.error==='audio-capture'){
      useTyped('マイクが使えませんでした。ブラウザのマイク許可を確認してください。');
      if(micReady){ const f=micReady; micReady=null; f(); }
    }
  };
  rec.onend=()=>{ recBase+=recFin; recFin=''; if(running&&!typedMode){ try{rec.start();}catch(_){} } };
  try{ rec.start(); }catch(_){ useTyped('マイクを開始できませんでした。'); }
}
function useTyped(msg){
  typedMode=true; $('typed').hidden=false;
  if(rec){ rec.onend=null; try{rec.stop();}catch(_){} }
  statusEl.innerHTML='<b>'+msg+'</b> 下の入力欄で試せます。';
  if(running) $('typedIn').focus();
}
$('typedIn').addEventListener('input',e=>{ if(running&&typedMode) feed(e.target.value,0); });

/* ---------- 進行 ---------- */
let starting=false, micReady=null;
document.addEventListener('pointerdown',()=>{ if(ctx&&ctx.state!=='running'){ try{ ctx.resume(); }catch(_){} } });
function start(){
  if(starting) return;
  // 毎回新しく音の出口を作り直す（前回のマイク使用で止まったままになるのを防ぐ）
  if(ctx){ try{ ctx.close(); }catch(_){} }
  if(rec){ rec.onresult=null; rec.onend=null; rec.onerror=null; try{ rec.abort(); }catch(_){} rec=null; }
  {
    ctx=new (window.AudioContext||window.webkitAudioContext)();
    master=ctx.createGain(); master.gain.value=0.8;
    analyser=ctx.createAnalyser(); analyser.fftSize=1024;
    // 高域を削り、低域を持ち上げてから出す
    const hi=ctx.createBiquadFilter(); hi.type='highshelf'; hi.frequency.value=4500; hi.gain.value=-7;
    const lo=ctx.createBiquadFilter(); lo.type='lowshelf'; lo.frequency.value=120; lo.gain.value=5;
    const comp=ctx.createDynamicsCompressor(); comp.threshold.value=-14; comp.ratio.value=4;
    master.connect(hi).connect(lo).connect(comp).connect(analyser).connect(ctx.destination);
    noiseBuf=ctx.createBuffer(1,ctx.sampleRate*0.5,ctx.sampleRate);
    const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    // 808 を歪ませて小さいスピーカーでも聞こえるように
    bassBus=ctx.createWaveShaper(); const cv=new Float32Array(1024);
    for(let i=0;i<1024;i++){ const x=i/512-1; cv[i]=Math.tanh(2.6*x); } bassBus.curve=cv; bassBus.connect(master);
    // 残響
    const len=Math.floor(ctx.sampleRate*2.4), ir=ctx.createBuffer(2,len,ctx.sampleRate);
    for(let c=0;c<2;c++){ const b=ir.getChannelData(c); for(let i=0;i<len;i++) b[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6); }
    const conv=ctx.createConvolver(); conv.buffer=ir;
    const revLp=ctx.createBiquadFilter(); revLp.type='lowpass'; revLp.frequency.value=2200;
    revSend=ctx.createGain(); revSend.gain.value=0.55; revSend.connect(conv).connect(revLp).connect(master);
  }
  saveRecord(); clearSheet(); pat=genPattern();
  starting=true; goBtn.disabled=true; inCount=true; skip=0;
  statusEl.textContent='準備中…';
  try{ ctx.resume(); }catch(_){}
  // 先にマイクを開き、音の出力先の切り替わりが落ち着いてからビートを始める
  const go=()=>{
    if(!starting) return; starting=false; micReady=null;
    const fire=()=>{ if(fired) return; fired=true; goBtn.disabled=false; begin(); };
    let fired=false, pr; try{ pr=ctx.resume(); }catch(_){}
    if(pr&&pr.then) pr.then(fire,fire);
    setTimeout(fire,600);
  };
  if(typedMode){ go(); return; }
  if(NATIVE){ startRecNative().then(go,go); return; }
  micReady=()=>setTimeout(go,350);
  startRec();
  if(typedMode){ go(); return; }
  setTimeout(go,1800);
}
function begin(){
  bpm=70+Math.floor(Math.random()*41); $('beatinfo').textContent='BPM '+bpm+' ・ Aマイナー';
  stepDur=60/bpm/4; totalSteps=16+ROWS*bars*16;
  tStart=ctx.currentTime+0.15; t0=tStart+16*stepDur; nextStep=0; nextTime=tStart;
  running=true; inCount=true; skip=0; lastCell=-2; lastRow=-2;
  goBtn.textContent='止める'; goBtn.classList.add('on');
  $('typedIn').value=''; $('bars').disabled=true; $('shuffle').disabled=true;
  statusEl.textContent='カウントのあとに始まります。';
  if(typedMode) $('typedIn').focus();
  timer=setInterval(tick,25); tick();
}
function stop(msg){
  running=false; clearInterval(timer);
  if(rec){ const r=rec; r.onend=()=>{ recBase+=recFin; recFin=''; }; setTimeout(()=>{ try{r.stop();}catch(_){} },1200); }
  goBtn.textContent='もう一回'; goBtn.classList.remove('on');
  $('bars').disabled=false; $('shuffle').disabled=false;
  countEl.hidden=true;
  document.querySelectorAll('.now').forEach(el=>el.classList.remove('now'));
  if(msg) statusEl.textContent=msg;
  setTimeout(saveRecord,1500);
}
function finish(){
  const hits=document.querySelectorAll('.word.hit').length;
  const own=text.slice(text.length-lens[ROWS*3]);
  stop(text?('おつかれさま。'+(ROWS-1)+'行中 '+hits+'行でお題に着地。'+(lens[ROWS*3]?'最後に自分で出した言葉は「'+own+'」。':'最後の言葉は聞き取れませんでした。')):'声が拾えませんでした。マイクの許可と音量を確認してください。');
}
goBtn.addEventListener('click',()=>{ running?stop('止めました。'):start(); });
$('shuffle').addEventListener('click',()=>{ saveRecord(); pickWords(); build(); isExample=false; $('exTag').hidden=true; lens.fill(0); text=''; });
$('bars').addEventListener('change',e=>{ bars=+e.target.value; });

/* ---------- 記録 ---------- */
const KEY='in-note-records';
function loadRecords(){ try{ return JSON.parse(localStorage.getItem(KEY))||[]; }catch(_){ return []; } }
function storeRecords(a){ try{ localStorage.setItem(KEY,JSON.stringify(a)); return true; }catch(_){ return false; } }
function saveRecord(){
  if(running||!text) return;
  const rows=[]; let pos=0;
  for(let r=0;r<ROWS;r++){
    const n=lens[r*3]+lens[r*3+1]+lens[r*3+2];
    if(r===ROWS-1) rows.push({text:text.substr(pos,n),word:text.substr(pos+n,lens[ROWS*3]),free:true,hit:false});
    else rows.push({text:text.substr(pos,n),word:words[r],hit:$('w'+r).classList.contains('hit')});
    pos+=n;
  }
  const a=loadRecords();
  a.unshift({at:Date.now(),bpm:bpm,bars:bars,tag:$('rhymeTag').textContent,rows:rows});
  if(!storeRecords(a.slice(0,100))) statusEl.textContent+=' （このブラウザでは記録を保存できませんでした）';
  text=''; renderLog(a);
}
function renderLog(a){
  a=a||loadRecords();
  const list=$('logList'); list.innerHTML=''; $('logEmpty').hidden=a.length>0;
  a.forEach((rec,i)=>{
    const d=new Date(rec.at), pad=n=>String(n).padStart(2,'0');
    const det=document.createElement('details'); det.className='entry'; if(i===0) det.open=true;
    const sum=document.createElement('summary');
    const mk=(c,t)=>{const s=document.createElement('span');s.className=c;s.textContent=t;sum.appendChild(s);};
    mk('when',(d.getMonth()+1)+'/'+d.getDate()+' '+pad(d.getHours())+':'+pad(d.getMinutes()));
    mk('meta','BPM '+rec.bpm+' ・ 韻 '+rec.tag);
    mk('score','着地 '+rec.rows.filter(r=>r.hit).length+'/'+rec.rows.filter(r=>!r.free).length);
    det.appendChild(sum);
    const ol=document.createElement('ol');
    rec.rows.forEach(r=>{
      const li=document.createElement('li'); li.textContent=(r.text||'（無言）')+(r.free&&r.word?' '+r.word:'');
      const w=document.createElement('span'); w.className='w'+(r.hit?' ok':''); w.textContent=r.free?(r.word?'自分で出した韻：'+r.word:'自分の韻：出せず'):'お題：'+r.word+(r.hit?' ◎':'');
      li.appendChild(w); ol.appendChild(li);
    });
    det.appendChild(ol);
    const del=document.createElement('button'); del.type='button'; del.className='del'; del.textContent='この記録を消す';
    del.addEventListener('click',()=>{ const b=loadRecords().filter(x=>x.at!==rec.at); storeRecords(b); renderLog(b); });
    det.appendChild(del); list.appendChild(det);
  });
}

/* ---------- 波の表示 ---------- */
const cv=$('wave'), g=cv.getContext('2d'); let buf=new Uint8Array(1024);
function css(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function draw(){
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth, H=cv.clientHeight;
  if(cv.width!==W*dpr||cv.height!==H*dpr){ cv.width=W*dpr; cv.height=H*dpr; }
  g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
  const ink=css('--ink'), wave=css('--wave'), rule=css('--rule'), pencil=css('--pencil');
  const L=22, R=W-12, base=H*0.6, span=R-L;
  // メロディの音程（2小節ぶん）
  if(pat){
    g.beginPath(); let prev=null;
    for(let s=0;s<32;s++){
      const n=pat.mel[s]; if(n!==null) prev=n; if(prev===null) continue;
      const x=L+span*(s/32), x2=L+span*((s+1)/32), y=base-6-(prev-57)/15*(base-22);
      if(s===0||g.__first){ g.moveTo(x,y); g.__first=false; } else g.lineTo(x,y);
      g.lineTo(x2,y);
    }
    g.strokeStyle=rule; g.lineWidth=2; g.lineJoin='round'; g.stroke();
  }
  // 基準線と左端の丸
  g.strokeStyle=ink; g.lineWidth=1.5; g.beginPath(); g.moveTo(L,base); g.lineTo(R,base); g.stroke();
  g.fillStyle=css('--sheet'); g.beginPath(); g.arc(L-8,base,6,0,Math.PI*2); g.fill(); g.stroke();
  // いま鳴っている音の波
  let el=-1;
  if(running&&analyser){
    analyser.getByteTimeDomainData(buf);
    g.beginPath();
    for(let i=0;i<buf.length;i+=2){
      const x=L+span*(i/buf.length), y=base-((buf[i]-128)/128)*H*0.9;
      i?g.lineTo(x,y):g.moveTo(x,y);
    }
    g.shadowColor=wave; g.shadowBlur=12; g.strokeStyle=wave; g.lineWidth=2; g.stroke(); g.shadowBlur=0;
    el=ctx.currentTime-t0;
    if(el>=0){
      const loop=32*stepDur, x=L+span*((el%loop)/loop);
      g.strokeStyle=pencil; g.lineWidth=2; g.beginPath(); g.moveTo(x,10); g.lineTo(x,H-8); g.stroke();
    }
  }
  if(running) progress(el);
  requestAnimationFrame(draw);
}
function progress(el){
  if(el<0){
    const b=Math.floor((ctx.currentTime-tStart)/(stepDur*4));
    if(b>=0){ countEl.hidden=false; countEl.textContent=String(4-b); }
    return;
  }
  if(inCount){ inCount=false; countEl.hidden=true; statusEl.textContent=typedMode?'打ち込んでください。':'聞き取り中。右端の言葉で終わるように。'; }
  const rowDur=bars*16*stepDur, r=Math.floor(el/rowDur);
  if(r>=ROWS) return;
  const p=(el-r*rowDur)/rowDur, cell=p<0.75?r*3+Math.floor(p/0.75*3):-1;
  if(cell!==lastCell||r!==lastRow){
    document.querySelectorAll('.now').forEach(e=>e.classList.remove('now'));
    if(cell>=0) $('c'+cell).classList.add('now'); else $('w'+r).classList.add('now');
    lastCell=cell; lastRow=r;
  }
}

if(NATIVE) $('webNote').hidden=true;
pickWords(); build(); showExample(); pat=genPattern(); renderLog();
requestAnimationFrame(draw);
})();
</script>
